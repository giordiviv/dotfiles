# Use <leader> + r to reload tmux configuration
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux configuration reloaded"

# Use mouse to select and resize panes
set -g mouse on

# Move between panes with H-J-K-L like NeoVim
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Status bar at the top
set-option -g status-position top

# windows and panes numbered from 1 not 0
set -g base-index 1
setw -g pane-base-index 1
# renumber windows when one is closed
set -g renumber-windows on

## All the following already in tmux-sensible
# No lag on <Esc> (matters for NeoVim)
# set -sg escape-time 10 

# History lines per panel to scroll (default 2000)
# set -g history-limit 10000

# Pass focus events through to applications
# e.g. NeoVim auto-read/save
# set -g focus-events on

# --- PLUGINS ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'catppuccin/tmux#v2.3.0'   # set to stable version 
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'

# ----------------------------------------------------
# Catppuccin
# ----------------------------------------------------
set -g @catppuccin_flavor 'frappe' # latte, frappe, macchiato or mocha
# Windows
set -g @catppuccin_window_status_style "rounded" # tab shape: basic, rounded, slanted, custom or none
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_status "no"
set -g @catppuccin_window_text "#W"
# Active window
set -g @catppuccin_window_number_color "#{@thm_blue}"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_window_current_number_color "#{@thm_peach}"
# Status modules (blocks like session, directory, date etc...)
set -g @catppuccin_directory_icon " "
set -g @catppuccin_directory_color "#{@thm_teal}"
set -g @catppuccin_session_icon " "
set -g @catppuccin_session_color "#{@thm_lavender}"
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_connect_separator "no" # yes, no
set -g @catppuccin_status_fill "icon"

# Load catppuccin now, so its status modules exist below and applies defaults
run ~/.config/tmux/plugins/tmux/catppuccin.tmux
set -g status-left-length 100
set -g status-left ""
set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_session}"
#set -ag status-right "#{E:@catppuccin_status_date_time}"

# Auto-restore last session when tmux starts
#set -g @continuum-restore 'on'

# bootstrap TPM itself on a brand-new machine
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm'"

# initialize tmux plugin manager
run '~/.config/tmux/plugins/tpm/tpm'
